---
engines:
  duplication:
    enabled: false
    config:
      languages:
        - ruby
  fixme:
    enabled: false
  shellcheck:
    enabled: true
ratings:
  paths:
  - support/**/*
  - bin/*
  - "**.rb"
exclude_paths:
- "**/vendor/**/*"
- gitaly/
- encore/
- encore-elasticsearch-indexer
- encore-shell/
- encore-workhorse/
- reposities/
- postgresql/
- redis/
